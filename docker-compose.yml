services:
  postgres:
    image: postgres:16
    container_name: rentalapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentalapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentalapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentalapp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/rentalapp
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-VGhpc0lzQUNvbXBvc2VEZWZhdWx0U2VjcmV0Rm9yTG9jYWxEZXZPbmx5MTIzNDU2}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: 3600000
      JWT_REFRESH_TOKEN_EXPIRATION_MS: 604800000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../RentalApp_Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    container_name: rentalapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  postgres-data:
